<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Chess</title>

  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="StyleSheet1.css" />
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="top-row">
        <h1>Chess vs Computer</h1>

        <div class="difficulty-box">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="300">Easy</option>
            <option value="700" selected>Medium</option>
            <option value="1200">Hard</option>
            <option value="2000">Very Hard</option>
          </select>
        </div>
      </div>

      <div id="board"></div>

      <div class="controls">
        <button id="newGameBtn">New Game</button>
        <button id="undoBtn">Undo Move</button>
        <button id="flipBtn">Flip Board</button>
        <button id="hintBtn">Get Engine Move</button>
      </div>

      <div class="status-box">
        <div><strong>Status:</strong> <span id="status">Loading...</span></div>
        <div><strong>Turn:</strong> <span id="turn">-</span></div>
        <div><strong>PGN:</strong> <span id="pgn">-</span></div>
      </div>
    </section>

    <section class="panel">
      <h2>Music Player</h2>

      <input type="file" id="songInput" accept="audio/*" multiple />

      <div class="music-meta">
        <p><strong>Now Playing:</strong> <span id="nowPlaying">No song selected</span></p>
        <p><strong>Time:</strong> <span id="timeInfo">00:00 / 00:00</span></p>
      </div>

      <div class="music-controls">
        <button id="prevBtn">Previous</button>
        <button id="playPauseBtn">Play</button>
        <button id="nextBtn">Next</button>
      </div>

      <div class="slider-group">
        <label for="seekBar">Progress</label>
        <input type="range" id="seekBar" min="0" max="100" value="0" />
      </div>

      <div class="slider-group">
        <label for="volumeBar">Volume</label>
        <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8" />
      </div>

      <ul id="playlist"></ul>

      <p class="small-note">
        Add your own songs from your device. They stay in this session only.
      </p>

      <audio id="audio"></audio>
    </section>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="Script1.js"></script>
</body>
</html>
